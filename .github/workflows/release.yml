name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: hopes-linux-x86_64.tar.gz
          - goos: darwin
            goarch: amd64
            asset: hopes-macos-x86_64.tar.gz
          - goos: darwin
            goarch: arm64
            asset: hopes-macos-aarch64.tar.gz
          - goos: linux
            goarch: arm64
            asset: hopes-linux-aarch64.tar.gz
          - goos: windows
            goarch: amd64
            asset: hopes-windows-x86_64.zip
          - goos: windows
            goarch: arm64
            asset: hopes-windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Release Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/ .

      - name: Package Archive
        working-directory: dist
        run: |
          case "${{ matrix.asset }}" in
            *.zip) zip ../${{ matrix.asset }} hopes.exe ;;
            *) tar -czf ../${{ matrix.asset }} hopes ;;
          esac

      - name: Generate Checksum
        run: sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
