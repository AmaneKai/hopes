name: Release

on:
  push:
    tags:
      - 'c-v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-aarch64
            os: macos-latest
          - target: macos-x86_64
            os: macos-15-intel
          - target: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev tmux

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pdcurses

      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: make check

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf hopes-${{ matrix.target }}.tar.gz -C build hopes
          shasum -a 256 hopes-${{ matrix.target }}.tar.gz > hopes-${{ matrix.target }}.tar.gz.sha256

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make
          ./build/hopes.exe --version
          zip -j hopes-${{ matrix.target }}.zip build/hopes.exe
          sha256sum hopes-${{ matrix.target }}.zip > hopes-${{ matrix.target }}.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hopes-${{ matrix.target }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
