name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: hopes
            asset_suffix: linux-x86_64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: hopes
            asset_suffix: macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: hopes
            asset_suffix: macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: hopes.exe
            asset_suffix: windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix Archive
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf hopes-${{ matrix.asset_suffix }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          7z a hopes-${{ matrix.asset_suffix }} ./target/${{ matrix.target }}/release/${{ matrix.bin_name }}

      - name: Generate Checksum (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          sha256sum hopes-${{ matrix.asset_suffix }} > hopes-${{ matrix.asset_suffix }}.sha256

      - name: Generate Checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          sha256sum hopes-${{ matrix.asset_suffix }} > hopes-${{ matrix.asset_suffix }}.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hopes-${{ matrix.asset_suffix }}
            hopes-${{ matrix.asset_suffix }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
