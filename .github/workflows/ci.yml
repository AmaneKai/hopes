name: CI

on:
  push:
    branches: [main, master, c-lean]
  pull_request:
    branches: [main, master, c-lean]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Style rules (no comments, max nesting)
        run: make lint

      - name: Warnings as errors (gcc)
        run: make strict

      - name: Warnings as errors (clang)
        run: make CC=clang strict

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev libsqlite3-dev tmux

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Unit tests (ASan, UBSan, LeakSanitizer on Linux)
        run: make test

      - name: Sqlite backend tests
        if: runner.os == 'Linux'
        run: make SQLITE=1 test

      - name: Binary size budget
        run: make size

      - name: Two-device git sync
        run: make sync-test

  windows:
    name: Build (windows-latest)
    needs: lint
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pdcurses

      - name: Build
        run: make

      - name: Smoke test
        run: ./build/hopes.exe --version

      - name: Unit tests
        run: make test
